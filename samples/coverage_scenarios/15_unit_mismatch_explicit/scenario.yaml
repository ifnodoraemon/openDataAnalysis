id: unit_mismatch_explicit
industry: manufacturing
task_length: long
prompt: 请分析各工厂盈利能力和单件成本，并说明是否存在效率差异。
files:
  - factory_cost_cny.csv
  - factory_revenue_10k_cny.csv
  - factory_output_units.csv
answers:
  - 按字段声明做单位换算后再比较，万元与元不直接混用。
acceptance:
  terminal_types: [run_completed, user_request_input]
  report_finalized: true
  no_error: true
  resume_if_asked: true
manual_review:
  - 单位换算由显式字段信息支持且在比较前完成。
  - 不直接比较万元收入与元成本。
