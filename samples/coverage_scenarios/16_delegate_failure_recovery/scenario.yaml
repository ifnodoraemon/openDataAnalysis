id: delegate_failure_recovery
industry: marketing
task_length: medium
prompt: 请分析各渠道 ROI、收入贡献和趋势变化，生成图表并输出最终报告。子任务边界清晰时可以把其中一部分委派给子代理，是否委派由你判断。
files:
  - marketing_spend_by_channel_month.csv
  - attributed_revenue_by_channel_month.csv
acceptance:
  terminal_types: [run_completed, user_request_input]
  report_finalized: true
  no_error: true
  failures_must_be_structured: true
manual_review:
  - 委派与否是模型自己的判断，不因未委派而判失败。
  - 若发生委派失败，失败以结构化事实返回，主运行继续完成分析而不是中断。
  - 最终报告仍覆盖 ROI、收入贡献与趋势。
