name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: ./server/go.sum
      - name: Run Go tests
        working-directory: ./server
        run: go test -v ./...
      - name: Run Go vet
        working-directory: ./server
        run: go vet ./...

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      - name: Run frontend tests
        working-directory: ./client
        run: npm test
      - name: Build Vue Client
        working-directory: ./client
        run: npm run build

  test-python-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ./python-executor
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run sandbox tests
        working-directory: ./python-executor
        env:
          PROXY_TOKEN: ci-test-token
          WORK_DIR: ${{ runner.temp }}/python-executor-workspace
          # A broken executor must fail the job instead of silently skipping
          # the HTTP-level tests.
          REQUIRE_EXECUTOR: "1"
        run: |
          python main.py &
          EXECUTOR_READY=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null; then
              EXECUTOR_READY=1
              break
            fi
            sleep 1
          done
          if [ "$EXECUTOR_READY" -ne 1 ]; then
            echo "python executor failed to become healthy"
            exit 1
          fi
          python -m pytest -q test_sandbox.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -severity medium ./server/...
      - name: npm audit
        working-directory: ./client
        run: npm audit --audit-level=high
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-python-executor, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: docker compose build
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images to ghcr.io
        if: github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in server client; do
            IMG="ghcr.io/${OWNER}/data-analysis-${svc}"
            docker tag "opendataanalysis-${svc}:latest" "${IMG}:${{ github.sha }}"
            docker tag "opendataanalysis-${svc}:latest" "${IMG}:latest"
            docker push "${IMG}:${{ github.sha }}"
            docker push "${IMG}:latest"
          done
          IMG="ghcr.io/${OWNER}/data-analysis-python"
          docker tag opendataanalysis-python-executor:latest "${IMG}:${{ github.sha }}"
          docker tag opendataanalysis-python-executor:latest "${IMG}:latest"
          docker push "${IMG}:${{ github.sha }}"
          docker push "${IMG}:latest"

  scenario-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Go tests
        working-directory: ./server
        run: go test -v ./...
      - name: Start services
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_SMOKE_MODEL: deepseek-ai/deepseek-v4-flash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY secret is required for scenario-smoke"
            exit 1
          fi
          mkdir -p tmp
          record_infra_blocked() {
            local category="$1"
            local message="$2"
            echo "::warning::scenario-smoke infra blocked: ${category}: ${message}"
            touch tmp/scenario-smoke.skip
            cat > tmp/smoke-test-summary.json <<CIEOF
          {
            "total": 1,
            "passed": 0,
            "failed": 0,
            "infra_blocked": 1,
            "pass_rate": "0%",
            "scenarios": [
              {"id": "nvidia_preflight", "status": "infra_blocked", "category": "${category}", "message": "${message}"}
            ]
          }
          CIEOF
          }
          cat > tmp/nvidia-smoke-preflight.json <<CIEOF
          {
            "model": "${NVIDIA_SMOKE_MODEL}",
            "messages": [{"role": "user", "content": "Reply with ok."}],
            "reasoning_effort": "none",
            "max_tokens": 32,
            "stream": false
          }
          CIEOF
          set +e
          curl --fail-with-body --max-time 90 -sS \
            -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
            -H "Content-Type: application/json" \
            https://integrate.api.nvidia.com/v1/chat/completions \
            -d @tmp/nvidia-smoke-preflight.json \
            -o tmp/nvidia-smoke-preflight-response.json \
            2>tmp/nvidia-smoke-preflight.stderr
          curl_code=$?
          set -e
          if [ "$curl_code" -ne 0 ]; then
            echo "NVIDIA preflight failed curl_exit=${curl_code}"
            cat tmp/nvidia-smoke-preflight.stderr
            if grep -Eiq '429|too many requests' tmp/nvidia-smoke-preflight.stderr tmp/nvidia-smoke-preflight-response.json 2>/dev/null; then
              record_infra_blocked "llm_rate_limited" "NVIDIA preflight returned 429"
              exit 0
            fi
            exit "$curl_code"
          fi
          if ! python3 -c "import json, sys; p=json.load(open('tmp/nvidia-smoke-preflight-response.json')); n=len(p.get('choices', [])); print('NVIDIA preflight model=%s choices=%s' % (p.get('model', '${NVIDIA_SMOKE_MODEL}'), n)); sys.exit(0 if n else 1)" | tee tmp/nvidia-smoke-preflight-summary.txt; then
            record_infra_blocked "llm_preflight_invalid_response" "NVIDIA preflight returned no choices"
            exit 0
          fi
          cat > server/.env <<CIEOF
          LLM_PROVIDER=openai
          LLM_BASE_URL=https://integrate.api.nvidia.com
          LLM_API_ENDPOINT=https://integrate.api.nvidia.com/v1/chat/completions
          LLM_API_KEY=${NVIDIA_API_KEY}
          LLM_MODEL=${NVIDIA_SMOKE_MODEL}
          LLM_REASONING_EFFORT=none
          LLM_MAX_TOKENS=4096
          LLM_DEBUG=true
          LLM_DEBUG_DIR=./data/llm-debug
          SERVER_PORT=8080
          PYTHON_MCP_URL=http://python-executor:8081
          PROXY_TOKEN=ci-smoke-token
          AUTH_SECRET=this-is-a-ci-smoke-test-auth-secret-val
          DEFAULT_USER_ID=testuser
          DEFAULT_USER_EMAIL=test@example.com
          DEFAULT_USER_NAME=SmokeTest
          DEFAULT_USER_PASSWORD=ci-smoke-test-password
          DEFAULT_WORKSPACE_ID=workspace_default
          DEFAULT_WORKSPACE_NAME=Default Workspace
          STORAGE_ROOT=./data/storage
          CACHE_ROOT=./data/cache
          METADATA_DB_PATH=./data/metadata/app.db
          TEMP_DIR=./data/tmp
          CIEOF
          # Ensure host-side data directories exist for bind mount with write perms
          mkdir -p data/metadata data/cache data/storage data/tmp
          chmod -R 777 data/
          # Compose-level shared secrets (PROXY_TOKEN is required by both the
          # backend and the python-executor service definitions).
          cat > .env <<'OVEOF'
          PROXY_TOKEN=ci-smoke-token
          METRICS_AUTH_TOKEN=ci-metrics-token
          OVEOF
          # Create CI override to expose server port for smoke test
          cat > docker-compose.ci.yml <<'OVEOF'
          services:
            server:
              ports:
                - "8080:8080"
          OVEOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          sleep 10
      - name: Run smoke scenarios
        env:
          SMOKE_SCENARIOS: "sales_complete ambiguous_metrics"
          SKIP_INFRA_FAILURES: "1"
        run: |
          if [ -f tmp/scenario-smoke.skip ]; then
            echo "Skipping live smoke scenarios because preflight was infra-blocked"
            exit 0
          fi
          bash scripts/smoke_test.sh http://127.0.0.1 240
      - name: Run eval report
        if: always()
        env:
          SKIP_INFRA_FAILURES: "1"
        run: node scripts/eval_report.js --results-dir tmp/scenario-runs
      - name: Dump smoke diagnostics
        if: failure()
        run: |
          if [ -f docker-compose.ci.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml ps || true
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=200 server python-executor || true
          else
            echo "docker compose was not started"
          fi
          find data/llm-debug -maxdepth 5 -type f | sort || true
          find data/llm-debug -name events.jsonl -print -exec tail -n 80 {} \; || true
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            tmp/smoke-test-summary.json
            tmp/nvidia-smoke-preflight*.json
            tmp/nvidia-smoke-preflight*.stderr
            tmp/nvidia-smoke-preflight*.txt
            tmp/scenario-runs
            tmp/eval-report.json
            data/llm-debug
          retention-days: 14
