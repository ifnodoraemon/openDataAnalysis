services:
  postgres:
    image: postgres:17-alpine
    container_name: data-analysis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oda
      POSTGRES_USER: oda
      POSTGRES_PASSWORD: oda_password
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oda -d oda"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: data-analysis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    container_name: data-analysis-server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      LLM_DEBUG: "true"
      LLM_DEBUG_DIR: /app/data/llm-debug
      METADATA_STORE: postgres
      POSTGRES_DSN: postgres://oda:oda_password@postgres:5432/oda?sslmode=disable
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: oda-storage
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - python-workspace:/app/python-workspace
    networks:
      - app-network
    depends_on:
      python-executor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

  python-executor:
    build: ./python-executor
    container_name: data-analysis-python
    restart: unless-stopped
    env_file: ./server/.env
    volumes:
      - ./data:/app/data:ro
      - python-workspace:/app/workspace
    networks:
      - app-network
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/workspace
      - /app/.local
      - /app/.cache

  client:
    build: ./client
    container_name: data-analysis-client
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      - app-network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

networks:
  app-network:
    driver: bridge

volumes:
  python-workspace:
  pg-data:
  minio-data:
