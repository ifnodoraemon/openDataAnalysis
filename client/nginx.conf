upstream backend_app {
    server data-analysis-server:8080;
}

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# HTTP Server (Port 8080 in container -> Port 80 on host)
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    access_log /var/log/nginx/access.log;
    error_log /dev/stderr warn;

    # All app and report-preview scripts/styles load same-origin (ECharts and
    # KaTeX ship under /assets); the report preview iframe (srcdoc, same-origin)
    # inherits this policy.
    set $oda_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $oda_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # The HTML document must always revalidate so bundle updates reach clients;
    # hashed asset files under /assets can cache forever.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $oda_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(js|css|svg|woff2?|ttf|eot|png|jpg|ico)$ {
        try_files $uri =404;
        expires 30d;
        # nginx locations with add_header do not inherit server-level headers;
        # repeat them here.
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $oda_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/sse {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /metrics {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
